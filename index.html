<body>
    <!-- Header -->
    <header>
       <div class="logo">
    <img src="assets/logo.png" alt="Logo">

    <div class="logo-text">
        <h2>Balls Of Fire</h2>
        <h3>Cricket Club</h3>
    </div>
</div>

    <!-- NAV-LINKS -->
     <nav id="mobile-nav">
          <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li> 
            <li><a href="aboutUs.html">About Us</a></li>
            <li>
              <a href="players.html">Players</a>
            </li>
            <li><a href="#">Matches</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">News</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
         <div class="search-container">
          <i class="fa-solid fa-magnifying-glass"></i>

          <input type="text" placeholder="Search..." class="search-input" />
        </div>
        <button class="menu-toggle">
  <i class="fa-solid fa-bars"></i>
</button>
            </header>

            <section class="hero">
              <div class="main-banner">
                <img src="assets/mainBanner.png" alt="">
                 <button class="join-btn">Join Club<i class="fa-solid fa-arrow-right"></i></button>
              </div> 
             
           
        
    <!-- player spotlight -->
    

  <div class="player-container">
    <div class="player-spotlight">
<h2 class="player-title">
  <i class="fa-solid fa-star"></i> Player Spotlight
</h2>

    <div class="player-image">
      <img src="assets/player.png" alt="Ali Shan Anjum">
    </div>

    <div class="player-name">
      <h3>Ali Shan Anjum</h3>
    </div>

    <div class="player-role">
      <span>All-Rounder</span>
    </div>

    <div class="stats-container">

      <div class="stat-box">
        <span class="stat-name">Matches</span>
        <span class="stat-value">50</span>
      </div>

      <div class="stat-box">
        <span class="stat-name">Wickets</span>
        <span class="stat-value">40</span>
      </div>

      <div class="stat-box">
        <span class="stat-name">Runs</span>
        <span class="stat-value">700</span>
      </div>
   <button class="player-btn">
      View Profile
    </button>
    </div>
</div> 
 

  </div>
   </section>
